<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Updating Kerosene</title>
  <link rel="stylesheet" href="update.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="pointer" aria-hidden="true"><span>Firefox asks up here</span></div>
  <main class="card" aria-live="polite">
    <div class="logo" aria-hidden="true">
      <svg class="flame" viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M12 2c.6 3.2-1.1 4.9-2.6 6.6C7.9 10.3 6.5 12 6.5 14.6 6.5 18.4 9 21 12 21s5.5-2.6 5.5-6.2c0-2.3-1-4-2.2-5.4-.3 1.6-1.1 2.7-2.3 3.2.5-2.9-.1-6.6-1-10.6Z"/></svg>
      <svg class="ring" viewBox="0 0 24 24" width="84" height="84"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="16 50" stroke-linecap="round"/></svg>
    </div>
    <h1>Updating Kerosene</h1>
    <p class="versions" id="versions"></p>
    <ol class="steps" id="steps">
      <li><span class="n">1</span> Click <b>Continue to Installation</b></li>
      <li><span class="n">2</span> Click <b>Add</b></li>
    </ol>
    <p class="note" id="note">Firefox asks before it installs anything that isn't from its add-on store. Kerosene is signed by Mozilla.</p>
    <div class="actions" id="actions" hidden>
      <button type="button" id="retry">Try again</button>
      <button type="button" id="cancel" class="ghost">Not now</button>
    </div>
  </main>
  <script src="../shared/compat.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="../shared/char-field.js"></script>
  <script src="update.js"></script>
</body>
</html>
