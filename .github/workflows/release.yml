# Publishes a release whenever manifest.json's version changes on main:
# builds both packages, gets Mozilla to sign the Firefox one (unlisted, so it
# installs normally in Firefox/Zen without being on addons.mozilla.org),
# uploads them to a GitHub release, and updates version.json / updates.json
# so the in-extension update button and Firefox's auto-update find it.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   AMO_JWT_ISSUER, AMO_JWT_SECRET  from https://addons.mozilla.org/developers/addon/api/key/
# The repo must be public so browsers can download releases.
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Build
        if: steps.exists.outputs.skip != 'true'
        run: python3 build.py

      - name: Sign the Firefox build with Mozilla (unlisted)
        if: steps.exists.outputs.skip != 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign --channel=unlisted --source-dir build/firefox --artifacts-dir signed
          cp signed/*.xpi dist/kerosene-firefox.xpi

      - name: Publish the GitHub release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          notes="$(git log -1 --format=%s -- manifest.json)"
          gh release create "v$v" dist/kerosene-firefox.xpi dist/kerosene-chrome.zip \
            --title "Kerosene $v" --notes "$notes"
          python3 scripts/release_manifests.py "$v" "$notes"

      - name: Point the update button and Firefox at the new release
        if: steps.exists.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json updates.json dist/kerosene-firefox.xpi
          git commit -m "Release ${{ steps.v.outputs.version }} [skip ci]"
          git push
